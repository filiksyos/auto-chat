<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Chat Control Bar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="service-selector">
        <button class="service-btn active" data-service="chatgpt" title="ChatGPT - General Q&A & Facts">💬 ChatGPT</button>
        <button class="service-btn" data-service="claude" title="Claude - Creative & Analysis">🎭 Claude</button>
        <button class="service-btn" data-service="gemini" title="Gemini - Images & Multimodal">✨ Gemini</button>
        <button class="service-btn" data-service="perplexity" title="Perplexity - Web Search">🔍 Perplexity</button>
        <button class="service-btn" data-service="grok" title="Grok - X AI Assistant">🤖 Grok</button>
        <button class="service-btn" data-service="lechat" title="Le Chat - Fast Answers & European Languages">🇫🇷 Le Chat</button>
      </div>
      <button id="settingsBtn" class="settings-icon-btn" title="Settings">⚙️</button>
    </div>
    
    <div class="input-row">
      <input
        type="text"
        id="textInput"
        class="text-input"
        placeholder="Type your message... Auto Chat will route it to the best AI!"
        spellcheck="true"
      />
      <span id="routingStatus" class="routing-status">🤖 Ready</span>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ System Prompt Settings</h2>
        <button id="closeModalBtn" class="modal-close" title="Close">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-description">
          Customize the AI routing system prompt to control when each service (ChatGPT, Gemini, Claude, Perplexity, Grok, Le Chat) should be used.
        </p>
        <div class="prompt-editor">
          <label for="promptTextarea">System Prompt:</label>
          <textarea
            id="promptTextarea"
            class="prompt-textarea"
            placeholder="Enter your custom system prompt here..."
            spellcheck="false"
          ></textarea>
          <div class="prompt-info">
            <span id="charCount" class="char-count">0 characters</span>
            <span class="prompt-hint">The prompt must include instructions for selecting between chatgpt, claude, gemini, perplexity, grok, and lechat</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="resetPromptBtn" class="modal-btn modal-btn-secondary" title="Reset to default prompt">Reset to Default</button>
        <div class="modal-footer-right">
          <button id="cancelModalBtn" class="modal-btn modal-btn-secondary">Cancel</button>
          <button id="savePromptBtn" class="modal-btn modal-btn-primary">Save</button>
        </div>
      </div>
      <div id="modalMessage" class="modal-message"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
